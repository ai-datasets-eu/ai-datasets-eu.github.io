<p class="lede">Surveys fielded in 2026 put the share using AI at <a class="fig fig-individuals" href="#individuals">54 to 61%</a> of people, <a class="fig fig-workers" href="#workers">31 to 52%</a> of workers and <a class="fig fig-firms" href="#firms">42 to 67%</a> of firms. The ranges are wide because each survey defines AI, use and its population in its own way.</p>
