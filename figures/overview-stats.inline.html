<div class="lede"><p>Surveys fielded in 2026 put the share using AI at:</p><ul class="lede-list"><li class="fig-individuals"><span><a class="fig" href="#individuals">54 to 61%</a> of people</span></li><li class="fig-workers"><span><a class="fig" href="#workers">31 to 52%</a> of workers</span></li><li class="fig-firms"><span><a class="fig" href="#firms">42 to 67%</a> of firms</span></li></ul><p>These ranges are wide, because each survey makes different choices when defining:</p><ul class="lede-list lede-list-plain"><li><span>artificial intelligence tools</span></li><li><span>adoption and intensity</span></li><li><span>the target population</span></li></ul></div>
